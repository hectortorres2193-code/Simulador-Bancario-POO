<footer>Rueda del ratón: zoom · Arrastrar: mover · Doble clic: ajustar a la pantalla · Teclas + − 0</footer>
<script>
(function(){
var vp=document.getElementById('vp'),V={},cur=null,names=['clases','paquetes','secuencia'];
function init(k){
  var p=document.getElementById('p-'+k),svg=p.querySelector('svg'),b=svg.viewBox.baseVal;
  svg.style.width=b.width+'px';svg.style.height=b.height+'px';
  V[k]={p:p,w:b.width,h:b.height,s:1,x:0,y:0,set:false};
}
names.forEach(init);
function apply(){var v=V[cur];v.p.style.transform='translate('+v.x+'px,'+v.y+'px) scale('+v.s+')';}
function box(){var r=vp.getBoundingClientRect();return {w:r.width,h:r.height};}
function fit(){var v=V[cur],r=box(),s=Math.min((r.w-24)/v.w,(r.h-24)/v.h);v.s=s;v.x=(r.w-v.w*s)/2;v.y=(r.h-v.h*s)/2;v.set=true;v.touched=false;apply();}
function fitW(){var v=V[cur],r=box(),s=(r.w-24)/v.w;v.s=s;v.x=12;v.y=12;v.set=true;apply();}
function actual(){var v=V[cur],r=box();v.s=1;v.x=Math.min(12,(r.w-v.w)/2);v.y=12;v.set=true;apply();}
function zoomAt(f,cx,cy){var v=V[cur],ns=Math.max(0.05,Math.min(6,v.s*f));v.x=cx-(cx-v.x)*(ns/v.s);v.y=cy-(cy-v.y)*(ns/v.s);v.s=ns;v.touched=true;apply();}
function show(k){
  if(names.indexOf(k)<0)k='clases';
  names.forEach(function(n){V[n].p.hidden=(n!==k);});
  cur=k;
  document.querySelectorAll('.tab').forEach(function(t){t.setAttribute('aria-selected',t.dataset.v===k?'true':'false');});
  if(!V[k].set)fit();else apply();
}
document.querySelectorAll('.tab').forEach(function(t){t.addEventListener('click',function(){location.hash=t.dataset.v;});});
window.addEventListener('hashchange',function(){show(location.hash.slice(1));});
document.getElementById('zi').onclick=function(){var r=box();zoomAt(1.25,r.w/2,r.h/2);};
document.getElementById('zo').onclick=function(){var r=box();zoomAt(0.8,r.w/2,r.h/2);};
document.getElementById('zf').onclick=fit;
document.getElementById('zw').onclick=fitW;
document.getElementById('z1').onclick=actual;
vp.addEventListener('dblclick',fit);
vp.addEventListener('wheel',function(e){e.preventDefault();var r=vp.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*0.0015),e.clientX-r.left,e.clientY-r.top);},{passive:false});
window.addEventListener('keydown',function(e){var r=box();
  if(e.key==='+'||e.key==='=')zoomAt(1.25,r.w/2,r.h/2);
  else if(e.key==='-')zoomAt(0.8,r.w/2,r.h/2);
  else if(e.key==='0')fit();});
var ptrs={},last=null;
vp.addEventListener('pointerdown',function(e){ptrs[e.pointerId]={x:e.clientX,y:e.clientY};vp.setPointerCapture(e.pointerId);vp.classList.add('drag');last=null;});
vp.addEventListener('pointermove',function(e){
  if(!ptrs[e.pointerId])return;
  var ids=Object.keys(ptrs),v=V[cur],prev=ptrs[e.pointerId];
  if(ids.length===1){v.x+=e.clientX-prev.x;v.y+=e.clientY-prev.y;v.touched=true;ptrs[e.pointerId]={x:e.clientX,y:e.clientY};apply();}
  else if(ids.length===2){
    ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
    var a=ptrs[ids[0]],b=ptrs[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y),r=vp.getBoundingClientRect();
    if(last)zoomAt(d/last,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);
    last=d;
  }
});
function up(e){delete ptrs[e.pointerId];last=null;if(!Object.keys(ptrs).length)vp.classList.remove('drag');}
vp.addEventListener('pointerup',up);vp.addEventListener('pointercancel',up);
window.addEventListener('resize',function(){if(cur&&!V[cur].touched){fit();}});
show(location.hash.slice(1));
})();
</script>
